# Publications — newest first. The page groups entries by `year`.
#
# Fields
#   title, year, image          required
#   venue        full venue name (shown in italics)
#   venue_short  short badge, e.g. "ECCV 2026"
#   award        optional highlight badge, e.g. "Spotlight", "Oral"
#   kind         optional plain badge, e.g. "Poster", "Dataset"
#   featured     true -> gold outline
#   topics       used by the filter chips: fashion | dataset | remote-sensing
#   tldr         one or two sentences
#   authors      list of {name, url, me: true, equal: true}
#   links        list of {label, url, icon}; icon is a Font Awesome 5 class
#   bibtex       optional; if missing, one is generated from the fields above
#   bibkey       optional key for the generated BibTeX

- title: "Dress-ED: Instruction-Guided Editing for Virtual Try-On and Try-Off"
  year: 2026
  image: /images/teaser_dressed.jpg
  venue: European Conference on Computer Vision (ECCV), 2026
  venue_short: ECCV 2026
  award: Spotlight
  kind: Dataset & Benchmark
  featured: true
  topics: [fashion, dataset]
  bibkey: lobba2026dress
  tldr: >-
    The first benchmark unifying virtual try-on, try-off and text-guided garment editing:
    146k verified quadruplets across three garment categories and seven edit types,
    built with a fully automated MLLM + diffusion curation pipeline.
