<!-- Design layer: fonts + skin. Skin is set with `skin:` in _config.yml (paper | clean | track). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
{% if site.skin_switcher %}
<script>
  /* Preview only: remember the skin picked in the switcher */
  try { var s = localStorage.getItem('fs-skin'); if (s) document.documentElement.setAttribute('data-skin', s); } catch (e) {}
</script>
{% endif %}
